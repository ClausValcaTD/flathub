app-id: io.github.M5Devs.OpenROM
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: openrom-wrapper.sh

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=host
  - --device=dri

modules:
  - name: openrom
    buildsystem: simple
    build-commands:
      # Extract AppImage payload
      - chmod +x OpenROM.AppImage
      - ./OpenROM.AppImage --appimage-extract

      # Setup directories
      - mkdir -p /app/bin /app/lib /app/share/applications /app/share/icons/hicolor/256x256/apps /app/share/metainfo

      # Copy extracted bundle payload
      - cp -r squashfs-root/usr/* /app/ 2>/dev/null || true
      - cp -r squashfs-root/* /app/ 2>/dev/null || true

      # Install wrapper, desktop, icon, and metainfo
      - install -Dm755 openrom-wrapper.sh /app/bin/openrom-wrapper.sh
      - install -Dm644 io.github.M5Devs.OpenROM.desktop /app/share/applications/io.github.M5Devs.OpenROM.desktop
      - install -Dm644 io.github.M5Devs.OpenROM.png /app/share/icons/hicolor/256x256/apps/io.github.M5Devs.OpenROM.png
      - install -Dm644 io.github.M5Devs.OpenROM.metainfo.xml /app/share/metainfo/io.github.M5Devs.OpenROM.metainfo.xml

    sources:
      - type: file
        url: https://github.com/M5Devs/OpenROM/releases/download/v3.9.5/OpenROM-v3.9.5_Linux_x86_64.AppImage
        sha256: a653801056e77aeab70376a0479d8a57fdfbfccef2cf1fade1111e1851078eae
        dest-filename: OpenROM.AppImage
      - type: file
        path: openrom-wrapper.sh
      - type: file
        path: io.github.M5Devs.OpenROM.desktop
      - type: file
        path: io.github.M5Devs.OpenROM.metainfo.xml
      - type: file
        path: io.github.M5Devs.OpenROM.png
